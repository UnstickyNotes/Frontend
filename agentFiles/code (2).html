<title>Authentication | Personal Workspace</title>
<!-- Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans for clean Warm Editorial typography -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">

<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },

            warm: {

              100: '#fbf9f3',

<!-- Custom Styles for Slider Animations -->
<style data-purpose="slider-layout">
    /* Base Container Mechanics */
    .auth-container {
      position: relative;
      overflow: hidden;
      min-height: 600px;
    }

    /* Form Panels */
    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      transition: all 0.65s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .sign-in-container {
      left: 0;
      width: 50%;
      z-index: 2;
    }

    .sign-up-container {
      left: 0;
      width: 50%;
      opacity: 0;
      z-index: 1;
    }

    /* Animated State: Shift Sign In to the Right */
    .auth-container.right-panel-active .sign-in-container {
      transform: translateX(100%);
      opacity: 0;
    }

    /* Animated State: Move Sign Up to Right and Fade In */
    .auth-container.right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 5;
      animation: showSignUp 0.65s;
    }

    @keyframes showSignUp {
      0%, 49.99% {
        opacity: 0;
        z-index: 1;
      }
      50%, 100% {
        opacity: 1;
        z-index: 5;
      }
    }

    /* Sliding Overlay Container */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.65s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 100;
    }

    .auth-container.right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    /* Inner Overlay with Gradient matching GIF reference */
    .overlay {
      position: relative;
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: #ffffff;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.65s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .auth-container.right-panel-active .overlay {
      transform: translateX(50%);
    }

    /* Individual Overlay Panels (Left & Right message blocks) */
    .overlay-panel {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0 48px;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
      transform: translateX(0);
      transition: transform 0.65s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .overlay-left {
      transform: translateX(-20%);
    }

    .auth-container.right-panel-active .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .auth-container.right-panel-active .overlay-right {
      transform: translateX(20%);
    }
  </style>
</head>
<body class="bg-warm-100 text-stone-800 antialiased min-h-screen flex flex-col font-sans transition-colors duration-300 dark:bg-stone-950 dark:text-stone-100">

<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>

<!-- Right Overlay Panel (Default active, inviting to Sign-Up as in reference GIF) -->

<!-- Interactive Logic Scripts -->
<script data-purpose="auth-slider-toggle">
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('authContainer');
      const signUpButton = document.getElementById('signUpBtn');
      const signInButton = document.getElementById('signInBtn');

      // Toggle to Sign Up panel (Slides overlay to the left)
      signUpButton.addEventListener('click', () => {
        container.classList.add('right-panel-active');
      });

      // Toggle to Sign In panel (Slides overlay back to the right)
      signInButton.addEventListener('click', () => {
        container.classList.remove('right-panel-active');
      });
    });
  </script>
<script data-purpose="theme-management">
    // Light / Dark mode toggle implementation
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeToggleText = document.getElementById('themeToggleText');

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      themeToggleText.textContent = isDark ? 'Light' : 'Dark';
    });

    // Initialize Lucide icons
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
